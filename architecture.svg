<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>Skyward architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c2333"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b8a80"/></marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#1c2333;stroke-width:2.5;rx:14}
    .h{font-size:20px;font-weight:700;fill:#1c2333;text-anchor:middle}
    .s{font-size:14px;fill:#55607a;text-anchor:middle}
    .l{font-size:13px;fill:#1c2333;text-anchor:middle}
    .t{font-size:13px;fill:#0b8a80;text-anchor:middle;font-weight:600}
    .e{stroke:#1c2333;stroke-width:2.5;fill:none}
    .tel{stroke:#0b8a80;stroke-width:2.5;fill:none;stroke-dasharray:7 5}
  </style>
  <rect width="1100" height="640" fill="#fafbfc"/>

  <rect class="box" x="30" y="240" width="190" height="110"/>
  <text class="h" x="125" y="285">Browser</text><text class="s" x="125" y="310">Skyward UI (ES modules)</text>

  <rect class="box" x="360" y="190" width="300" height="210" style="stroke:#d98a16"/>
  <text class="h" x="510" y="228">Node.js backend</text>
  <text class="s" x="510" y="252">Express · pg · openai (ESM)</text>
  <text class="s" x="510" y="284" style="font-family:monospace">GET  /api/search · /api/insights</text>
  <text class="s" x="510" y="306" style="font-family:monospace">POST /api/chat · /api/book</text>
  <rect x="395" y="340" width="230" height="38" rx="19" fill="#fbd24d"/>
  <text class="l" x="510" y="364" style="font-weight:700">+ EDOT Node.js (--import)</text>

  <rect class="box" x="760" y="30" width="310" height="150"/>
  <text class="h" x="915" y="62">Flight providers (mock)</text>
  <text class="s" x="915" y="90">PuffinAir :4001 · GooseJet :4002</text>
  <text class="s" x="915" y="112">Pelican Air :4003 · Penguin Air :4004</text>
  <text class="s" x="915" y="146">1.3 s each · sequential vs concurrent</text>

  <rect class="box" x="760" y="215" width="310" height="110"/>
  <text class="h" x="915" y="255">PostgreSQL</text>
  <text class="s" x="915" y="280">recent searches = retrieved user context</text>
  <text class="s" x="915" y="300">:5432 (Docker)</text>

  <rect class="box" x="760" y="360" width="310" height="120"/>
  <text class="h" x="915" y="397">LLM</text>
  <text class="s" x="915" y="422">Local model (Ollama container)</text>
  <text class="s" x="915" y="442">or OpenAI, same client</text>
  <text class="s" x="915" y="462">answers the app's chat</text>

  <rect class="box" x="360" y="500" width="300" height="110" style="stroke:#0b8a80"/>
  <text class="h" x="510" y="535">Elastic Observability</text>
  <text class="s" x="510" y="558">traces · metrics · logs (OTLP)</text>
  <text class="s" x="510" y="580">APM, Service map, GenAI spans</text>
  <rect x="700" y="520" width="370" height="90" rx="14" fill="#f1fbfa" stroke="#0b8a80" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="t" x="885" y="548">Elastic's investigation agent</text>
  <text class="s" x="885" y="570">reads this telemetry to diagnose the bugs.</text>
  <text class="s" x="885" y="590">A separate thing from the app's LLM above.</text>

  <path class="e" d="M220 295 H355" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="l" x="288" y="283">HTTP</text>
  <path class="e" d="M660 245 C700 200 710 130 755 110" marker-end="url(#a)"/>
  <text class="l" x="712" y="150">/fares</text>
  <path class="e" d="M660 290 H755" marker-end="url(#a)"/>
  <text class="l" x="708" y="281">SQL</text>
  <path class="e" d="M660 345 C700 380 710 400 755 410" marker-end="url(#a)"/>
  <text class="l" x="720" y="398">prompt</text>
  <path class="tel" d="M510 400 V495" marker-end="url(#t)"/>
  <text class="t" x="560" y="455">OTLP</text>
</svg>
